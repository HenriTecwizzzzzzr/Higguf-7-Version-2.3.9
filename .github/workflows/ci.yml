name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest PyYAML
          python -m pip install --editable .
      - name: Run unit tests
        run: python -m pytest -q
      - name: Verify published resource configurations
        run: |
          python scripts/estimate_resources.py --config configs/higguf-2b.yaml
          python scripts/estimate_resources.py --config configs/higguf-18b.yaml
      - name: Validate corpus provenance manifest
        run: python scripts/validate_corpus_manifest.py
