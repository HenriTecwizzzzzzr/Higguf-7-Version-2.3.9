# Higguf#7 2B target: trained entirely from random initialisation.
# Exact parameter count with tied embeddings: 2,063,854,080.
# Free T4 x2 pilot: requires FSDP/ZeRO-3 with CPU offload; DataParallel will OOM.
# Validated on Kaggle for one WikiText update using FP16 initialization + Adafactor.
# Use FSDP SHARDED_STATE_DICT checkpoints for resuming; LOCAL_STATE_DICT is save-only here.
model:
  vocab_size: 32000
  hidden_size: 2560
  intermediate_size: 8704
  num_layers: 24
  num_attention_heads: 20
  num_key_value_heads: 4
  max_sequence_length: 2048
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: fp16
  optimizer: adafactor
  micro_batch_size: 1
  gradient_accumulation_steps: 64
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 500000000
  max_tokens: 100000000000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 100
  checkpoint_keep_last: 2
  output_dir: checkpoints/higguf-7-2b

data:
  train_path: data/tokenized/train.bin
