# First executable Higguf#7 milestone.  It begins from random weights and
# shares the 18B architecture's key choices, but is small enough for a single GPU.
model:
  vocab_size: 8192
  hidden_size: 768
  intermediate_size: 2048
  num_layers: 16
  num_attention_heads: 12
  num_key_value_heads: 4
  max_sequence_length: 512
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: fp16
  micro_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 10000000
  max_tokens: 2000000000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 1000
  output_dir: checkpoints/higguf-7-seed-107m

data:
  train_path: data/tokenized/wikitext-103-seed/train.bin
