# One-step CPU verification of the full 107M Seed architecture on real corpus
# tokens. This is intentionally not a substitute for a GPU training run.
model:
  vocab_size: 8192
  hidden_size: 768
  intermediate_size: 2048
  num_layers: 16
  num_attention_heads: 12
  num_key_value_heads: 4
  max_sequence_length: 128
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: fp32
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 10000
  max_tokens: 2000000000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 1
  output_dir: checkpoints/higguf-7-seed-107m-cpu-pilot

data:
  train_path: data/tokenized/wikitext-103-seed/train.bin
