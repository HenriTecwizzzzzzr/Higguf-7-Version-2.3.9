# Higguf#7 6B target: trained entirely from random initialisation.
# Exact parameter count with tied embeddings: 5,919,461,376.
model:
  vocab_size: 32000
  hidden_size: 4096
  intermediate_size: 12288
  num_layers: 30
  num_attention_heads: 32
  num_key_value_heads: 8
  max_sequence_length: 2048
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: bf16
  micro_batch_size: 1
  gradient_accumulation_steps: 128
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 1500000000
  max_tokens: 300000000000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 1000
  output_dir: checkpoints/higguf-7-6b

data:
  train_path: data/tokenized/train.bin
