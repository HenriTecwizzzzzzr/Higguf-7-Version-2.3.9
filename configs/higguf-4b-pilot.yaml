# Exact 3,960,655,872-parameter Higguf#7 4B architecture, configured only for
# a one-update FSDP feasibility pilot. This is not a reduced-size model, but its
# 8-token context and one update are deliberately not full pretraining.
model:
  vocab_size: 32000
  hidden_size: 4096
  intermediate_size: 10752
  num_layers: 22
  num_attention_heads: 32
  num_key_value_heads: 8
  max_sequence_length: 8
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: fp16
  optimizer: adafactor
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 8
  max_tokens: 8
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 1
  checkpoint_keep_last: 2
  output_dir: checkpoints/higguf-7-4b-pilot

data:
  train_path: data/tokenized/train.bin
