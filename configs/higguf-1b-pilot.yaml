# Exact 1.06B-parameter Higguf#7 architecture configured for one small,
# resumable FSDP feasibility update. It is not a trained or chat-ready model.
model:
  vocab_size: 32000
  hidden_size: 2048
  intermediate_size: 5632
  num_layers: 22
  num_attention_heads: 16
  num_key_value_heads: 4
  max_sequence_length: 8
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: fp16
  optimizer: adafactor
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 8
  max_tokens: 8
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 1
  checkpoint_keep_last: 2
  sync_module_states: false
  output_dir: checkpoints/higguf-7-1b-pilot

data:
  train_path: data/tokenized/train.bin
