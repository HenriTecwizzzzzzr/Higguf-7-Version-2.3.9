# Runs the exact model code locally, but at a size suitable for a CPU test.
model:
  vocab_size: 256
  hidden_size: 128
  intermediate_size: 352
  num_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  max_sequence_length: 64
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: fp32
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 10000
  max_tokens: 100000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 100
  output_dir: checkpoints/smoke-test

data:
  train_path: data/tokenized/train.bin

