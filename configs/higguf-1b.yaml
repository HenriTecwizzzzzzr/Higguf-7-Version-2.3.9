# Higguf#7 1B-class target, trained from random initialisation.
# Exact parameter count with tied embeddings: 1,057,581,056.
# This is a separate model; it cannot inherit useful weights from the 94.6M
# Seed pilot. Use the FSDP launcher on at least two compatible CUDA GPUs.
model:
  vocab_size: 32000
  hidden_size: 2048
  intermediate_size: 5632
  num_layers: 22
  num_attention_heads: 16
  num_key_value_heads: 4
  max_sequence_length: 1024
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: fp16
  optimizer: adafactor
  micro_batch_size: 1
  gradient_accumulation_steps: 128
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 500000000
  max_tokens: 100000000000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 100
  checkpoint_keep_last: 2
  sync_module_states: false
  output_dir: checkpoints/higguf-7-1b

data:
  train_path: data/tokenized/train.bin
