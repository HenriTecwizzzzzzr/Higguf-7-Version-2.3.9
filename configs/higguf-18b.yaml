# Higguf#7 18B target: trained entirely from random initialisation.
model:
  vocab_size: 65536
  hidden_size: 6144
  intermediate_size: 15040
  num_layers: 48
  num_attention_heads: 48
  num_key_value_heads: 8
  max_sequence_length: 4096
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: bf16
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 2000000000
  max_tokens: 400000000000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 1000
  output_dir: checkpoints/higguf-7-18b

data:
  train_path: data/tokenized/train.bin
