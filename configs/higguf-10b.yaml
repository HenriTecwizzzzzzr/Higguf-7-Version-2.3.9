# Higguf#7 10B target: trained entirely from random initialisation.
# Exact parameter count with tied embeddings: 9,915,919,360.
model:
  vocab_size: 32000
  hidden_size: 5120
  intermediate_size: 16384
  num_layers: 31
  num_attention_heads: 40
  num_key_value_heads: 8
  max_sequence_length: 2048
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  seed: 7
  precision: bf16
  micro_batch_size: 1
  gradient_accumulation_steps: 256
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 2500000000
  max_tokens: 500000000000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  checkpoint_every_steps: 1000
  output_dir: checkpoints/higguf-7-10b

data:
  train_path: data/tokenized/train.bin
